; The Winehouse — PHP tuning (dev)
; Opcache + a large realpath cache make a huge difference over the
; Docker Desktop (Windows) bind mount, which is slow at file stats/reads.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Cache resolved file paths so PHP stops re-stat'ing the bind mount constantly
realpath_cache_size=8M
realpath_cache_ttl=600

memory_limit=256M
upload_max_filesize=64M
post_max_size=64M
