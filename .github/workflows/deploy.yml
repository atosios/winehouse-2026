name: Build & Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build & Deploy (Angular + Laravel)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js for Angular
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: winehouse-site/package-lock.json

      # 3. Build Frontend (Angular)
      - name: Install & Build Frontend
        run: |
          cd winehouse-site
          npm ci
          npm run build

      # 4. Setup PHP for Laravel
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, json
          tools: composer:v2

      # 5. Install Backend Dependencies
      - name: Install Backend Composer Dependencies
        run: |
          cd winehouse-be
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-req=php+

      # 6. Install LFTP
      - name: Install LFTP Deploy Tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      # 7. Deploy Frontend to public_html via LFTP
      - name: Deploy Frontend to public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" << 'EOF'
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mkdir -p public_html
          mirror -R --parallel=10 --verbose \
            --exclude-glob winehouse-be* \
            ./winehouse-site/dist/winehouse-site/browser/ ./public_html/
          put -f -O ./public_html/ ./winehouse-site/dist/winehouse-site/browser/index.html
          put -f -O ./public_html/ ./winehouse-site/dist/winehouse-site/browser/.htaccess
          quit
          EOF

      # 8. Deploy Backend to public_html/winehouse-be via LFTP
      - name: Deploy Backend to public_html/winehouse-be
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" << 'EOF'
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mkdir -p public_html/winehouse-be
          mirror -R --parallel=10 --verbose \
            --exclude-glob .git* \
            --exclude-glob .env* \
            --exclude-glob tests/ \
            --exclude-glob node_modules/ \
            --exclude-glob storage/logs/*.log \
            ./winehouse-be/ ./public_html/winehouse-be/
          quit
          EOF
