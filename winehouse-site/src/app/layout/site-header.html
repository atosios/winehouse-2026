<header class="sticky top-0 z-50 border-b border-border bg-background/90 backdrop-blur-sm">
  <div class="shell flex items-center justify-between gap-6 py-4">

    <!-- Brand mark -->
    <a routerLink="/" (click)="closeMenu()" class="group flex items-center gap-3" [attr.aria-label]="site.name + ' — home'">
      <wh-logo variant="default" [size]="46" class="transition-transform duration-300 group-hover:-rotate-3 group-hover:scale-105" />
    </a>

    <!-- Desktop nav -->
    <nav class="hidden items-center gap-8 md:flex" aria-label="Main">
      @for (item of site.nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }"
           class="nav-link">{{ item.label }}</a>
      }
    </nav>

    <!-- Mobile menu toggle -->
    <button type="button" class="md:hidden -mr-2 p-2 text-foreground" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-controls="mobile-nav" aria-label="Toggle menu">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        @if (menuOpen()) {
          <path d="M5 5 Q 13 14 21 21 M21 5 Q 13 14 5 21" />
        } @else {
          <path d="M3 7 Q 13 5.5 23 7 M3 13.5 Q 13 12 23 13.5 M3 20 Q 13 18.5 23 20" />
        }
      </svg>
    </button>
  </div>

  <!-- Mobile nav -->
  @if (menuOpen()) {
    <nav id="mobile-nav" class="border-t border-border bg-background md:hidden" aria-label="Main mobile">
      <div class="shell flex flex-col gap-1 py-4">
        @for (item of site.nav; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }"
             (click)="closeMenu()" class="nav-link py-2 text-base">{{ item.label }}</a>
        }
      </div>
    </nav>
  }
</header>
